name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install matplotlib numpy pycodestyle
      - name: Style check
        run: pycodestyle --exclude=.ipynb_checkpoints src test
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s test/unit -v
      - name: Functional tests
        run: bash test/func/test_fire_gdp.sh

